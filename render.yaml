services:
  - name: votehub
    type: web
    env: node
    buildCommand: mkdir -p data uploads && npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_USER_USERNAME
        sync: false
      - key: SEED_USER_PASSWORD
        sync: false
      - key: BACKUP_REPO
        sync: false
      - key: BACKUP_BRANCH
        sync: false
      - key: BACKUP_TOKEN
        sync: false
      - key: NODE_VERSION
        value: "20"
