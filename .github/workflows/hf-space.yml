name: deploy-hf-space

on:
  push:
    branches: [main]
    paths-ignore:
      - 'android-app/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install -q "huggingface_hub>=0.26"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          SPACE_REPO: linqing66/xiaomu-community
        run: |
          python - <<'PY'
          import hashlib, os, sys
          from huggingface_hub import HfApi, create_repo, upload_folder

          token = (os.environ.get("HF_TOKEN") or "").strip()
          backup = (os.environ.get("BACKUP_TOKEN") or "").strip()
          if not token:
              sys.exit("缺少仓库 Secret: HF_TOKEN（HF Write token）")
          if not backup:
              sys.exit("缺少仓库 Secret: BACKUP_TOKEN（GitHub 备份仓库 token）")

          repo_id = os.environ["SPACE_REPO"]
          api = HfApi(token=token)
          create_repo(repo_id, repo_type="space", space_sdk="docker", exist_ok=True, private=False)

          # JWT 密钥由备份 token 派生：跨次部署保持稳定，且不落库到公开仓库
          jwt_secret = hashlib.sha256(("votehub-jwt-" + backup).encode()).hexdigest()
          for key, value in {
              "JWT_SECRET": jwt_secret,
              "BACKUP_REPO": "lingjian140/csui",
              "BACKUP_BRANCH": "xiaomu-backup",
              "BACKUP_TOKEN": backup,
              "SEED_ADMIN_USERNAME": "xiaomu",
              "SEED_ADMIN_PASSWORD": "xiaomu",
              "SEED_USER_USERNAME": "aimin",
              "SEED_USER_PASSWORD": "mu123123123",
              "TZ": "Asia/Shanghai",
              "PORT": "10000",
          }.items():
              api.add_space_secret(repo_id, key, value)

          readme = '''---
title: 小木社区
emoji: "\U0001F343"
colorFrom: green
colorTo: green
sdk: docker
app_port: 10000
pinned: false
---

小木社区
'''
          api.upload_file(
              path_or_fileobj=readme.encode("utf-8"),
              path_in_repo="README.md",
              repo_id=repo_id,
              repo_type="space",
          )

          upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path=".",
              ignore_patterns=[
                  "android-app/**", "apk/**", ".git/**", ".github/**",
                  "data/**", "uploads/**", ".uploads/**", "node_modules/**",
                  "*.log", ".env",
              ],
          )
          print("Space updated:", api.repo_info(repo_id, repo_type="space").id)
          print("URL: https://" + repo_id.replace("/", "-") + ".hf.space")
          PY
