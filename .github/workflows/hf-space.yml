name: deploy-hf-space

on:
  push:
    branches: [main]
    paths-ignore:
      - 'android-app/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install -q "huggingface_hub>=0.26"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          SPACE_REPO: linqing66/xiaomu-community
        run: python .github/scripts/deploy_hf.py
